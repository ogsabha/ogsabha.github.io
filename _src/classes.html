<!--MAIN-->
<section id="classes" class="panel active">
      <div class="cl-ctrl">
        <div id="class-chips" class="cl-classes" role="group" aria-label="Your class"></div>
        <select id="class-select" aria-label="Your class" hidden></select>
        <div id="day-chips" class="daynav" role="group" aria-label="Day of the week">
          <button type="button" class="dchip" data-day="Monday" aria-label="Monday">Mon</button><button type="button" class="dchip" data-day="Tuesday" aria-label="Tuesday">Tue</button><button type="button" class="dchip" data-day="Wednesday" aria-label="Wednesday">Wed</button><button type="button" class="dchip" data-day="Thursday" aria-label="Thursday">Thu</button><button type="button" class="dchip" data-day="Friday" aria-label="Friday">Fri</button><button type="button" class="dchip" data-day="Saturday" aria-label="Saturday">Sat</button><button type="button" class="dchip" data-day="Sunday" aria-label="Sunday">Sun</button>
        </div>
      </div>

      <div id="notice-box">
        <div id="notice-list"></div>
        <details id="notice-compose" hidden>
          <summary>＋ Post a notice (admins only)</summary>
          <form id="notice-form">
            <p class="muted">Posting to <strong id="notice-to"></strong>. Everyone in that class will see it at the top of the timetable.</p>
            <textarea id="notice-text" maxlength="400" rows="4" required placeholder="Test moved to Friday, bring your ID card..."></textarea>
            <div class="row"><span id="notice-count" class="muted">0 / 400</span><button type="submit">Publish notice</button></div>
            <p id="notice-msg" class="muted"></p>
          </form>
        </details>
      </div>

      <div id="cl-feature" class="cl-feature" aria-live="polite">
        <div class="cl-stage">
          <div class="cl-slab" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="cl-watch" id="cl-watch" role="button" tabindex="0" aria-label="Tap the clock">
            <div class="bwrap">@@CLOCK@@</div><span class="cl-wname" id="cl-wname"></span>
          </div>
          <div class="cl-rail" id="cl-rail" role="group" aria-label="Period"></div>
        </div>
        <div class="cl-copy">
          <span class="cl-badge" id="cl-badge">Loading</span>
          <h2 id="cl-h2">&nbsp;</h2>
          <p class="cl-when"><span id="cl-when"></span><small id="cl-when-sub"></small></p>
          <div class="cl-prog" id="cl-prog" hidden><i></i></div>
          <p class="cl-desc" id="cl-desc"></p>
          <div class="cl-ar"><span class="cl-att" id="cl-att" hidden></span><div class="cl-actions" id="cl-actions"></div></div>
          <a class="cl-btn" href="timetable.html">Full weekly timetable</a>
        </div>
      </div>

      <div id="cl-list" class="cl-list"></div>
      <div id="cl-dots" class="cl-dots"></div>
      <p id="cl-sum" class="cl-sum"></p>

      <figure class="cl-quote"><blockquote id="quote-text"></blockquote><figcaption id="quote-by"></figcaption></figure>
    </section>
