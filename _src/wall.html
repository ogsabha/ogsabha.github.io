        <form id="post-form" class="cn-form">
          <fieldset class="cn-sins">
            <legend>What is it about?</legend>
            <div class="cn-chips">
              <label><input type="radio" name="cf-sin" value="bunk"><span>Bunked a class</span></label>
              <label><input type="radio" name="cf-sin" value="proxy"><span>Proxy attendance</span></label>
              <label><input type="radio" name="cf-sin" value="copy"><span>Copied homework</span></label>
              <label><input type="radio" name="cf-sin" value="crush"><span>A secret crush</span></label>
              <label><input type="radio" name="cf-sin" value="food"><span>Wasted mess food</span></label>
              <label><input type="radio" name="cf-sin" value="worse"><span>Something else</span></label>
            </div>
          </fieldset>
          <button type="button" class="cn-dice" id="cn-dice">[Roll a prompt]</button>

          <div class="cn-slip" id="cf-card">
            <label for="post-text" class="sr-only">Your note</label>
            <textarea id="post-text" maxlength="300" rows="5"
              placeholder="Write it here. Please do not name or target anyone."></textarea>
            <div class="cn-seal" aria-hidden="true"><span>Sent for review</span></div>
          </div>

          <div class="cn-row">
            <div class="cn-meter" id="cf-meter">
              <i></i>
              <span><span id="cf-meter-txt">Nothing written yet.</span> <span id="post-count">0 / 300</span></span>
            </div>
            <button type="submit" class="cn-wax">Send it</button>
          </div>
          <p id="post-msg" class="cn-msg" aria-live="polite"></p>
        </form>
      </div>

      <div id="pending-box" hidden>
        <h2 class="cn-h">Waiting for approval</h2>
