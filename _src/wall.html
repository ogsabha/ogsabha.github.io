<!--TOP-->
<!--MAIN-->
<section id="wall" class="panel active">
  <div class="wl-room" id="wl-room">
    <div class="wl-inner">
      <div class="wl-copy">
        <h2 class="wl-title">A confession&rsquo;s trace</h2>
        <p class="wl-brief">The collected <i class="bar"></i> files let us hear our <i class="bar b2"></i> voices.</p>
        <p class="wl-lede">Nothing here has a name. A person reads every file before it goes on the board.</p>
        <div class="wl-tools" role="group" aria-label="Board tools">
          <button type="button" class="wl-btn" id="wl-random">Pull a random file</button>
          <button type="button" class="wl-btn" id="wl-lamp" aria-pressed="false">Lights: dim</button>
          <button type="button" class="wl-btn" id="wl-down">File a confession</button>
        </div>
        <p class="wl-hint" id="wl-hint">Tap a file to read it in full. Drag files to rearrange the strings.</p>
        <div class="wl-flip" id="wl-flip" role="img" aria-label="Local time"><b>--</b><b>--</b></div>
      </div>

      <div class="wl-board">
        <button type="button" class="wl-lampbtn" id="wl-lampsvg" aria-label="Pull the lamp chain">
          <svg viewBox="0 0 150 190" aria-hidden="true"><path class="lp-arm" d="M30 178 L60 120 L112 52"/><path class="lp-arm" d="M30 178 L92 134 L112 52" opacity=".5"/><path class="lp-shade" d="M86 40 L138 30 L128 78 Z"/><circle id="wl-lamphead" cx="120" cy="64" r="7" fill="#ffe6a8"/><rect x="8" y="176" width="66" height="9" rx="3" class="lp-arm"/></svg>
        </button>
        <div class="wl-grid">
          <svg class="wl-strings" id="wl-strings" aria-hidden="true"></svg>
          <div id="post-list" class="wl-posts"><p class="wl-empty">Opening the case&hellip;</p></div>
        </div>
        <div class="wl-posts-head"><span class="muted" id="wl-count" aria-live="polite"></span></div>
      </div>
    </div>
    <div class="wl-fx" id="wl-fx" aria-hidden="true"><div class="wl-dark"></div></div>
  </div>

  <div id="pending-box" class="wl-pendbox" hidden>
    <h2 class="wl-h">Waiting for approval</h2>
    <div id="pending-list"></div>
  </div>

  <form id="post-form" class="wl-file">
    <span class="wl-stamp" id="wl-stamp" aria-hidden="true">Filed</span>
    <label for="post-text" class="wl-label">Form 23-55: confession</label>
    <textarea id="post-text" maxlength="300" rows="5" placeholder="Type what you have never said out loud. Do not name or target anyone."></textarea>
    <div class="row">
      <span id="post-count" class="muted">0 / 300</span>
      <button type="submit">Seal and file</button>
    </div>
    <p id="post-msg" class="muted" aria-live="polite"></p>
  </form>
</section>
